    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 3px solid #00ff88;
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.05) 0%, transparent 100%);
            border-radius: 10px;
        }

        .header-brand {
            font-size: 0.85em;
            color: #00ffff;
            letter-spacing: 3px;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .header-subtitle {
            font-size: 1.1em;
            color: #00ff88;
            margin-top: 5px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(0, 255, 136, 0.1);
            padding: 15px 30px;
            border-radius: 8px;
            border: 2px solid #00ff88;
        }

        .stat-box h3 {
            color: #00ff88;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-box p {
            font-size: 1.8em;
            font-weight: bold;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 25px;
            border: 2px solid #00ff88;
            background: transparent;
            color: #00ff88;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .filter-btn:hover {
            background: #00ff88;
            color: #1a1a2e;
            transform: scale(1.05);
        }

        .filter-btn.active {
            background: #00ff88;
            color: #1a1a2e;
        }

        .search-box {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.1);
            color: #fff;
            border-radius: 5px;
            font-size: 1em;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .game-card {
            background: #16213e;
            border: 2px solid #00ff88;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
            border-color: #00ffff;
        }

        .game-card.faltante {
            opacity: 0.8;
        }

        .game-card.faltante:hover {
            opacity: 1;
        }

        .game-image {
            width: 100%;
            height: 240px;
            background: #0f3460;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            text-align: center;
            padding: 10px;
            color: #00ff88;
            font-weight: bold;
        }

        .game-info {
            padding: 15px;
        }

        .game-title {
            font-size: 0.95em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #00ff88;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        .game-details {
            font-size: 0.8em;
            color: #bbb;
            margin-bottom: 8px;
        }

        .game-genre {
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .game-size {
            color: #ff9500;
            margin-bottom: 10px;
        }

        .game-status {
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            text-align: center;
        }

        .status-poseido {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        .status-faltante {
            background: rgba(255, 150, 0, 0.2);
            color: #ff9500;
            border: 1px solid #ff9500;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #bbb;
            font-size: 1.2em;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 2px solid #00ff88;
            margin-top: 40px;
            color: #888;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .stats {
                gap: 20px;
            }
        }
    </style>
</head>

        let currentFilter = 'todos';
        let searchTerm = '';

        function renderGames() {
            const grid = document.getElementById('games-grid');
            const noResults = document.getElementById('no-results');
            grid.innerHTML = '';

            let filteredGames = games;

            // Aplicar filtro de estado
            if (currentFilter !== 'todos') {
                filteredGames = filteredGames.filter(g => g.estado === currentFilter);
            }

            // Aplicar búsqueda
            if (searchTerm) {
                filteredGames = filteredGames.filter(g => 
                    g.nombre.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    g.genero.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            if (filteredGames.length === 0) {
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';

            filteredGames.forEach(game => {
                const card = document.createElement('div');
                card.className = `game-card ${game.estado}`;
                card.innerHTML = `
                    <div class="game-image">
                        🎮 ${game.nombre}
                    </div>
                    <div class="game-info">
                        <div class="game-title">${game.nombre}</div>
                        <div class="game-details">
                            <div class="game-genre">📁 ${game.genero}</div>
                            <div class="game-size">💾 ${game.peso}</div>
                        </div>
                        <div class="game-status ${game.estado === 'poseido' ? 'status-poseido' : 'status-faltante'}">
                            ${game.estado === 'poseido' ? '✓ POSEÍDO' : '✗ FALTANTE'}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            updateStats();
        }

        function updateStats() {
            const total = games.length;
            const owned = games.filter(g => g.estado === 'poseido').length;
            const missing = games.filter(g => g.estado === 'faltante').length;

            document.getElementById('total-games').textContent = total;
            document.getElementById('owned-games').textContent = owned;
            document.getElementById('missing-games').textContent = missing;
        }

        // Event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderGames();
            });
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderGames();
        });

        // Render inicial
        renderGames();
    </script>
