            color: rgba(255, 255, 255, 0.4);

        .search-box input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
            border-color: #60a5fa;
        }

        .games-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .games-table thead {
            background: rgba(124, 58, 237, 0.15);
            border-bottom: 2px solid #7c3aed;
        }

        .games-table th {
            padding: 15px;
            text-align: left;
            color: #a78bfa;
            font-weight: bold;
            border-right: 1px solid #7c3aed;
        }

        .games-table th:last-child {
            border-right: none;
        }

        .games-table tbody tr {
            border-bottom: 1px solid rgba(124, 58, 237, 0.2);
            transition: background 0.3s ease;
        }

        .games-table tbody tr:hover {
            background: rgba(124, 58, 237, 0.1);
        }

        .games-table td {
            padding: 12px 15px;
            border-right: 1px solid rgba(124, 58, 237, 0.1);
        }

        .games-table td:last-child {
            border-right: none;
        }

        .game-name {
            color: #a78bfa;
            font-weight: bold;
        }

        .game-genre {
            color: #60a5fa;
        }

        .game-size {
            color: #bbb;
        }

        .game-sinopsis {
            color: #ccc;
            font-size: 0.9em;

            color: #4ade80;

            }

            }

        let searchTerm = '';

        function renderGames() {
            const tbody = document.getElementById('games-tbody');
            const noResults = document.getElementById('no-results');
            tbody.innerHTML = '';

            let filteredGames = juegos;

            if (searchTerm) {
                filteredGames = filteredGames.filter(g => 
                    g.nombre.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    g.genero.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            if (filteredGames.length === 0) {
                noResults.style.display = 'block';
                document.getElementById('games-table').style.display = 'none';
                return;
            }

            noResults.style.display = 'none';
            document.getElementById('games-table').style.display = 'table';

            filteredGames.forEach(game => {
                const row = document.createElement('tr');
                const multijugadorClass = game.multijugador_local === 'Sí' ? 'multijugador-si' : 'multijugador-no';
                row.innerHTML = `
                    <td class="game-name">${game.nombre}</td>
                    <td class="game-genre">${game.genero}</td>
                    <td class="game-size">${game.peso}</td>
                    <td class="game-sinopsis">${game.sinopsis}</td>
                    <td class="${multijugadorClass}">${game.multijugador_local}</td>
                `;
                tbody.appendChild(row);
            });

            updateStats();
        }

        function updateStats() {
            const total = juegos.length;
            document.getElementById('total-games').textContent = total;
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderGames();
        });

        renderGames();
    </script>
